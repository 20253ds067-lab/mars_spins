<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lobby | Mars Spins</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/principal.css" />
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <header class="navbar">
    <div class="nav-left">
      <span class="brand-label nav-brand">Mars Spins</span>
    </div>

    <div class="nav-right">
      <div class="balance-chip">
        <div class="balance-icon">$</div>
        <div class="balance-info">
          <span class="balance-lbl">Fichas Ficticias</span>
          <span class="balance-val">$1,000</span>
        </div>
      </div>

      <div class="user-pill">
        <div class="user-avatar">👤</div>
        <span>Carlos Apreza</span>
      </div>
    </div>
  </header>

  <!-- ===== HERO BANNER ===== -->
  <section class="hero">
    <div class="hero-bg"></div>
 
  </section>

  <!-- ===== SECCIÓN JUEGOS ===== -->
  <section class="section" id="juegos">
    <h2 class="section-hdr">Juegos</h2>

    <div class="games-grid">

      <!-- Ruleta -->
      <div class="game-card">
        <div class="game-thumb thumb-espacial">
          <span></span>
        
        </div>
        <div class="game-body">
          <div class="game-title">Ruleta</div>
          <button class="btn-play">Jugar</button>
        </div>
      </div>

      <!-- Black Jack -->
      <div class="game-card">
        <div class="game-thumb thumb-bj">
          <span></span>
     
        </div>
        <div class="game-body">
          <div class="game-title">Black Jack</div>
          <button class="btn-play" onclick="window.location.href='blackjack.html'">Jugar</button>
        </div>
      </div>

      <!-- Tragamonedas -->
      <div class="game-card">
        <div class="game-thumb thumb-slots">
          <span></span>
   
        </div>
        <div class="game-body">
          <div class="game-title">Tragamonedas</div>
          <button class="btn-play">Jugar</button>
        </div>
      </div>

      <!-- Dados -->
      <div class="game-card">
        <div class="game-thumb thumb-dados">
          <span ></span>
 
        </div>
        <div class="game-body">
          <div class="game-title">Dados</div>
          <button class="btn-play">Jugar</button>
        </div>
      </div>

    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="footer-grid">

  

    </div>

  </footer>

</body>
</html>
