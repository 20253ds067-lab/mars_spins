<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear Cuenta | Mars Spins</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/registro.css" />
</head>
<body>

  <div class="auth-card">

    <span class="brand-label">Mars Spins</span>

    <h1>Crea tu cuenta</h1>
    <p class="subtitle">Ruleta, blackjack y dados en un solo lugar.</p>

    <div class="form-group">
      <label class="field-label">Usuario</label>
      <input class="field-input" type="text" placeholder="Tu usuario" />
    </div>

    <div class="form-group">
      <label class="field-label">Correo</label>
      <input class="field-input" type="email" placeholder="tu@correo.com" />
    </div>

    <div class="form-group">
      <label class="field-label">Contraseña</label>
      <input class="field-input" type="password" placeholder="Mínimo 8 caracteres" />
    </div>

    <div class="form-group">
      <label class="field-label">Confirmar contraseña</label>
      <input class="field-input" type="password" placeholder="Repite tu contraseña" />
    </div>

    <div class="form-actions">
      <button class="btn-gold" onclick="window.location.href='principal.html'">
        Crear cuenta
      </button>
    </div>

    <p class="auth-footer">
      ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
    </p>

  </div>

</body>
</html>
