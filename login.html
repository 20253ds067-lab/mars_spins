<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión | Mars Spins</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <!-- ===== COLUMNA IZQUIERDA: Formulario (50%) ===== -->
  <div class="left-panel">
    <div class="left-panel-content">
      <span class="brand-label">Mars Spins</span>

      <h1>Bienvenido de nuevo</h1>

      <div class="form-group">
        <label class="field-label" for="usuario">Usuario</label>
        <input class="field-input" id="usuario" type="text" placeholder="Tu usuario" />
      </div>

      <div class="form-group">
        <label class="field-label" for="password">Contraseña</label>
        <input class="field-input" id="password" type="password" placeholder="••••••••" />
      </div>

      <div class="form-actions">
        <button class="btn-gold" onclick="window.location.href='principal.html'">
          Iniciar sesión
        </button>
      </div>

      <p class="auth-footer">
        ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
      </p>
    </div>
  </div>

  <!-- ===== COLUMNA DERECHA: Imagen Ruleta (50%) ===== -->
  <div class="right-panel"></div>

</body>
</html>
